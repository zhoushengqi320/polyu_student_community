<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Course PDF Pipeline · PolyUHub</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">独立工具 · 非网站页面</p>
        <h1>课程 PDF → Qwen → JSONL</h1>
        <p class="sub">
          支持按院系文件夹自动串行扫描；每个文件夹完成后自动保存 JSONL，全部完成后生成合并文件。
        </p>
      </div>
      <div id="health" class="health">检查配置中…</div>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>1. 本地目录串行扫描（推荐）</h2>
        <p class="hint">
          默认扫描仓库 <code>课程/</code> 下各院系子文件夹（AAE、COMP…），扫完一个自动开始下一个。
        </p>
        <div id="localPreview" class="muted">读取本地目录预览…</div>
        <div class="actions" style="margin-top: 0.75rem">
          <button id="previewBtn" class="btn">刷新预览</button>
          <button id="localStartBtn" class="btn primary" disabled>开始串行扫描</button>
        </div>

        <hr class="sep" />

        <h2>或：上传 PDF</h2>
        <p class="hint">选择整个「课程」文件夹时，会按子文件夹自动串行处理并自动保存。</p>
        <label class="drop" id="dropzone">
          <input id="fileInput" type="file" accept="application/pdf,.pdf" multiple hidden />
          <span>点击选择或拖拽 PDF 到此处</span>
        </label>
        <div class="actions" style="margin-top: 0.75rem">
          <label class="btn">
            选择多个 PDF
            <input id="fileInputBtn" type="file" accept="application/pdf,.pdf" multiple hidden />
          </label>
          <label class="btn">
            选择整个文件夹
            <input id="folderInput" type="file" accept="application/pdf,.pdf" webkitdirectory multiple hidden />
          </label>
        </div>
        <ul id="fileList" class="file-list"></ul>
        <button id="startBtn" class="btn primary" disabled>开始解析上传文件</button>
      </section>

      <section class="panel">
        <h2>2. 任务 / 批次进度</h2>
        <div id="jobMeta" class="muted">尚未创建任务</div>
        <div class="progress"><div id="bar" class="bar"></div></div>
        <div id="batchFolders" class="batch-folders"></div>
        <div class="actions">
          <button id="refreshBtn" class="btn" disabled>刷新</button>
          <button id="retryBtn" class="btn" disabled>重试当前失败项</button>
          <button id="exportBtn" class="btn primary" disabled>下载 JSONL</button>
        </div>
        <div id="jobList" class="job-list"></div>
      </section>

      <section class="panel wide">
        <h2>3. 结果预览 / 校对</h2>
        <div id="detail" class="detail muted">选择左侧条目查看抽取结果</div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
